<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스카이워쳐 망원경 조립하기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #FDFBF7;
      color: #333333;
      touch-action: manipulation;
    }
    .ivory-bg {
      background-color: #FDFBF7;
    }
    /* 카드 및 버튼 애니메이션 */
    .part-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .part-card:hover:not(.disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px -3px rgba(0, 0, 0, 0.08);
    }
    .part-card:active:not(.disabled) {
      transform: translateY(1px);
    }
    /* 조립 완료된 부품 서서히 나타나는 효과 */
    .assembled-part {
      animation: fadeInScale 0.5s ease-out forwards;
    }
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* 부품 카드 내 SVG 스케일 및 정렬 */
    .part-preview-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .part-preview-icon svg {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* 오답 경고 토스트 애니메이션 */
    @keyframes shake {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      20%, 60% { transform: translateX(calc(-50% - 8px)) translateY(0); }
      40%, 80% { transform: translateX(calc(-50% + 8px)) translateY(0); }
    }
    .shake-anim {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="ivory-bg h-full w-full flex flex-col justify-between select-none p-1.5 sm:p-2.5 overflow-hidden">

  <!-- 헤더 -->
  <header class="w-full py-1 px-2 border-b border-amber-100 flex justify-between items-center max-w-6xl mx-auto shrink-0 h-9 sm:h-10">
    <div class="flex items-center space-x-1.5">
      <span class="text-base sm:text-lg">🔭</span>
      <h1 class="text-xs sm:text-base font-bold text-amber-900 tracking-tight">스카이워쳐 망원경 교실</h1>
    </div>
    <button id="reset-btn" class="hidden text-[11px] sm:text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 py-0.5 px-2.5 rounded-full font-semibold transition-colors">
      🔄 다시 시작
    </button>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-1 flex flex-col justify-center items-center overflow-hidden min-h-0">

    <!-- 1단계: 시작 화면 -->
    <section id="screen-start" class="w-full h-full flex flex-col items-center justify-center text-center p-2">
      <div class="w-20 h-20 sm:w-28 sm:h-28 mb-4 rounded-full bg-amber-100 flex items-center justify-center shadow-inner shrink-0">
        <svg class="w-12 h-12 sm:w-16 sm:h-16 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path>
        </svg>
      </div>
      <h2 class="text-xl sm:text-3xl font-extrabold text-amber-950 mb-5">망원경을 알아볼까요?</h2>
      <button id="btn-start" class="bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white font-bold text-base sm:text-lg py-2.5 px-7 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-200 transform hover:-translate-y-0.5">
        시작하기
      </button>
    </section>

    <!-- 2단계: 2초 안내 화면 -->
    <section id="screen-intro" class="hidden w-full h-full flex-col items-center justify-center text-center p-2">
      <div class="bg-white/90 border-2 border-amber-200 p-5 sm:p-8 rounded-3xl shadow-md max-w-lg w-full">
        <div class="inline-block animate-bounce text-3xl mb-2">📢</div>
        <h2 class="text-lg sm:text-2xl font-bold text-amber-900 leading-relaxed">
          망원경을 설치하는 순서를<br>맞춰볼까요?
        </h2>
        <div class="mt-4 w-full bg-amber-100 rounded-full h-2 overflow-hidden">
          <div id="intro-progress" class="bg-amber-600 h-2 rounded-full w-0 transition-all duration-[2000ms] ease-linear"></div>
        </div>
      </div>
    </section>

    <!-- 3단계: 부품 선택 및 조립 플레이 화면 -->
    <section id="screen-game" class="hidden w-full h-full flex-col items-center justify-between overflow-hidden min-h-0">
      
      <!-- 오답 메시지 팝업 (경고) -->
      <div id="error-toast" class="opacity-0 pointer-events-none fixed top-12 left-1/2 transform -translate-x-1/2 bg-red-500 text-white font-bold text-xs sm:text-sm px-4 py-1.5 rounded-full shadow-xl transition-all duration-300 z-50 flex items-center space-x-1.5">
        <span>⚠️</span>
        <span>다시 생각해 봐요.</span>
      </div>

      <!-- 성공 완성 메시지 -->
      <div id="success-message" class="hidden w-full mb-1 bg-emerald-100 border border-emerald-400 text-emerald-900 py-1 px-2 rounded-xl text-center shadow-sm animate-bounce shrink-0">
        <h3 class="text-xs sm:text-sm font-black">🎉 잘했어요! 🎉</h3>
        <p class="text-[10px] text-emerald-700 font-medium">스카이워쳐 망원경을 올바른 순서대로 완성했습니다!</p>
      </div>

      <!-- 화면 배치: 세로모드는 상단(망원경 42%)+하단(부품목록), 가로모드는 좌우(50%:50%) 배치 -->
      <div class="flex flex-col landscape:flex-row lg:flex-row gap-1.5 sm:gap-2.5 w-full h-full overflow-hidden min-h-0">
        
        <!-- 상단(세로모드)/왼쪽(가로모드): 조립 진행 상황 뷰어 (영역 크기 보장) -->
        <div class="bg-white border-2 border-amber-200/80 rounded-xl sm:rounded-2xl p-1.5 sm:p-2 shadow-sm flex flex-col items-center justify-between h-[42%] landscape:h-full lg:h-full w-full landscape:w-1/2 lg:w-1/2 shrink-0 landscape:shrink overflow-hidden min-h-[180px]">
          <div class="w-full flex justify-between items-center border-b border-amber-100 pb-0.5 shrink-0">
            <span class="text-[10px] sm:text-xs font-bold text-amber-800 tracking-wider uppercase">조립 진행 상황</span>
            <span id="progress-text" class="text-[10px] sm:text-xs font-extrabold text-amber-600">0 / 8 완료</span>
          </div>

          <!-- 그래픽 조립 영역 -->
          <div class="relative w-full flex-1 flex items-center justify-center min-h-0 py-0.5 overflow-hidden">
            <svg id="telescope-svg" viewBox="0 0 400 400" class="w-full h-full max-h-full max-w-full">
              <defs>
                <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#94a3b8"/>
                  <stop offset="50%" stop-color="#64748b"/>
                  <stop offset="100%" stop-color="#475569"/>
                </linearGradient>
                <linearGradient id="scope-body" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#0f172a"/>
                  <stop offset="40%" stop-color="#334155"/>
                  <stop offset="100%" stop-color="#1e293b"/>
                </linearGradient>
              </defs>

              <!-- 1. 삼각대 (Tripod) -->
              <g id="vis-tripod" class="hidden assembled-part">
                <line x1="200" y1="240" x2="100" y2="380" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
                <line x1="200" y1="240" x2="300" y2="380" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
                <line x1="200" y1="240" x2="200" y2="390" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
                <path d="M 140 310 L 260 310" stroke="#94a3b8" stroke-width="4"/>
                <circle cx="200" cy="240" r="14" fill="#334155"/>
              </g>

              <!-- 2. 가대 (Mount) -->
              <g id="vis-mount" class="hidden assembled-part">
                <rect x="185" y="180" width="30" height="60" rx="6" fill="url(#metal)"/>
                <circle cx="200" cy="185" r="18" fill="#475569"/>
                <path d="M 180 170 L 220 170 L 210 195 L 190 195 Z" fill="#334155"/>
              </g>

              <!-- 3. 추봉 (Counterweight Shaft) -->
              <g id="vis-shaft" class="hidden assembled-part">
                <line x1="200" y1="185" x2="260" y2="245" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
              </g>

              <!-- 4. 무게추 (Counterweights - 2개) -->
              <g id="vis-weight" class="hidden assembled-part">
                <!-- 첫 번째 무게추 (상단) -->
                <rect x="220" y="200" width="20" height="24" rx="4" fill="#1e293b" transform="rotate(45 230 212)"/>
                <!-- 두 번째 무게추 (하단) -->
                <rect x="238" y="218" width="20" height="24" rx="4" fill="#1e293b" transform="rotate(45 248 230)"/>
              </g>

              <!-- 5. 경통 (Optical Tube) -->
              <g id="vis-tube" class="hidden assembled-part">
                <g transform="rotate(-25 190 145)">
                  <rect x="60" y="130" width="240" height="34" rx="6" fill="url(#scope-body)"/>
                  <rect x="56" y="128" width="12" height="38" rx="3" fill="#0284c7"/>
                  <rect x="296" y="130" width="8" height="34" rx="2" fill="#475569"/>
                  <rect x="150" y="127" width="16" height="40" rx="2" fill="#d97706"/>
                  <rect x="190" y="127" width="16" height="40" rx="2" fill="#d97706"/>
                </g>
              </g>

              <!-- 6. 파인더 (Finderscope) -->
              <g id="vis-finder" class="hidden assembled-part">
                <g transform="rotate(-25 190 145)">
                  <rect x="110" y="112" width="6" height="20" fill="#64748b"/>
                  <rect x="85" y="104" width="65" height="14" rx="3" fill="#475569"/>
                  <rect x="83" y="103" width="5" height="16" fill="#0284c7"/>
                </g>
              </g>

              <!-- 7. 조절 나사 (Adjustment Screws) -->
              <g id="vis-screws" class="hidden assembled-part">
                <circle cx="175" cy="195" r="7" fill="#d97706"/>
                <line x1="175" y1="195" x2="160" y2="210" stroke="#d97706" stroke-width="3"/>
                <circle cx="160" cy="210" r="4" fill="#b45309"/>
                <g transform="rotate(-25 190 145)">
                  <circle cx="280" cy="172" r="6" fill="#d97706"/>
                </g>
              </g>

              <!-- 8. 접안렌즈 (Eyepiece) -->
              <g id="vis-eyepiece" class="hidden assembled-part">
                <g transform="rotate(-25 190 145)">
                  <path d="M 304 147 L 320 147 L 320 162 Z" fill="#64748b"/>
                  <rect x="314" y="162" width="12" height="18" rx="2" fill="#0f172a"/>
                  <circle cx="320" cy="180" r="7" fill="#38bdf8"/>
                </g>
              </g>
            </svg>
          </div>

          <!-- 가이드 텍스트 -->
          <p id="hint-text" class="text-[10px] sm:text-xs font-semibold text-amber-800 bg-amber-50 w-full py-0.5 px-1.5 rounded-lg text-center border border-amber-200/60 shrink-0">
            👉 첫 번째로 설치할 부품을 선택하세요.
          </p>
        </div>

        <!-- 하단(세로모드)/오른쪽(가로모드): 부품 선택 카드 리스트 -->
        <div class="flex flex-col w-full landscape:w-1/2 lg:w-1/2 flex-1 landscape:h-full lg:h-full overflow-hidden min-h-0 justify-between">
          <div class="mb-0.5 px-0.5 flex justify-between items-center shrink-0">
            <h3 class="font-bold text-amber-950 text-[11px] sm:text-xs">부품 목록 (터치하여 조립)</h3>
            <span class="text-[9px] sm:text-[10px] text-amber-700">순서대로 터치하세요!</span>
          </div>

          <!-- 부품 버튼 그리드 -->
          <div id="parts-grid" class="grid grid-cols-3 landscape:grid-cols-4 lg:grid-cols-3 gap-1 sm:gap-1.5 w-full flex-1 min-h-0 items-stretch">
            <!-- JavaScript에서 동적 생성 -->
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- 푸터 -->
  <footer class="w-full text-center py-0.5 border-t border-amber-100 text-[9px] sm:text-[10px] text-amber-700/70 shrink-0 h-3.5">
    Sky-Watcher Telescope Assembly Simulator
  </footer>

  <script>
    const PARTS_DATA = [
      { 
        id: 'tripod',   
        order: 1, 
        name: '삼각대',   
        svgContent: `
          <svg viewBox="80 210 240 190" preserveAspectRatio="xMidYMid meet">
            <line x1="200" y1="230" x2="95" y2="385" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
            <line x1="200" y1="230" x2="305" y2="385" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
            <line x1="200" y1="230" x2="200" y2="390" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
            <path d="M 135 315 L 265 315" stroke="#94a3b8" stroke-width="6"/>
            <circle cx="200" cy="230" r="18" fill="#334155"/>
          </svg>`, 
        desc: '망원경 지탱 다리' 
      },
      { 
        id: 'mount',    
        order: 2, 
        name: '가대',     
        svgContent: `
          <svg viewBox="165 155 70 95" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="metal-m" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#475569"/>
              </linearGradient>
            </defs>
            <rect x="183" y="178" width="34" height="64" rx="6" fill="url(#metal-m)"/>
            <circle cx="200" cy="183" r="20" fill="#475569"/>
            <path d="M 175 168 L 225 168 L 213 195 L 187 195 Z" fill="#334155"/>
          </svg>`, 
        desc: '경통 회전 및 고정' 
      },
      { 
        id: 'shaft',    
        order: 3, 
        name: '추봉',     
        svgContent: `
          <svg viewBox="180 170 80 80" preserveAspectRatio="xMidYMid meet">
            <line x1="190" y1="180" x2="260" y2="250" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
          </svg>`, 
        desc: '무게추를 연결하는 봉' 
      },
      { 
        id: 'weight',   
        order: 4, 
        name: '무게추 (2개)',   
        svgContent: `
          <svg viewBox="180 170 90 90" preserveAspectRatio="xMidYMid meet">
            <rect x="200" y="185" width="26" height="32" rx="5" fill="#1e293b" transform="rotate(45 213 201)"/>
            <rect x="222" y="207" width="26" height="32" rx="5" fill="#1e293b" transform="rotate(45 235 223)"/>
          </svg>`, 
        desc: '균형을 맞추는 무게추' 
      },
      { 
        id: 'tube',     
        order: 5, 
        name: '경통',     
        svgContent: `
          <svg viewBox="50 80 300 140" preserveAspectRatio="xMidYMid meet">
            <defs>
              <linearGradient id="scope-m" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
              </linearGradient>
            </defs>
            <g transform="rotate(-12 200 150)">
              <rect x="60" y="125" width="280" height="50" rx="8" fill="url(#scope-m)"/>
              <rect x="54" y="121" width="16" height="58" rx="4" fill="#0284c7"/>
              <rect x="338" y="125" width="12" height="50" rx="3" fill="#475569"/>
              <rect x="160" y="120" width="20" height="60" rx="3" fill="#d97706"/>
              <rect x="210" y="120" width="20" height="60" rx="3" fill="#d97706"/>
            </g>
          </svg>`, 
        desc: '빛 모으는 본체' 
      },
      { 
        id: 'finder',   
        order: 6, 
        name: '파인더',   
        svgContent: `
          <svg viewBox="40 20 120 80" preserveAspectRatio="xMidYMid meet">
            <g transform="translate(10, 0)">
              <rect x="85" y="55" width="12" height="28" fill="#64748b"/>
              <rect x="40" y="38" width="100" height="24" rx="5" fill="#475569"/>
              <rect x="35" y="35" width="10" height="30" fill="#0284c7"/>
            </g>
          </svg>`, 
        desc: '목표 천체 보조 망원경' 
      },
      { 
        id: 'screws',   
        order: 7, 
        name: '조절 나사', 
        svgContent: `
          <svg viewBox="135 150 80 80" preserveAspectRatio="xMidYMid meet">
            <circle cx="175" cy="195" r="14" fill="#d97706"/>
            <line x1="175" y1="195" x2="155" y2="215" stroke="#d97706" stroke-width="7"/>
            <circle cx="155" cy="215" r="8" fill="#b45309"/>
          </svg>`, 
        desc: '각도 및 초점 미세 조절' 
      },
      { 
        id: 'eyepiece', 
        order: 8, 
        name: '접안렌즈', 
        svgContent: `
          <svg viewBox="15 10 70 85" preserveAspectRatio="xMidYMid meet">
            <g transform="translate(0, 0)">
              <path d="M 20 20 L 45 20 L 45 42 Z" fill="#64748b"/>
              <rect x="35" y="42" width="20" height="32" rx="4" fill="#0f172a"/>
              <circle cx="45" cy="76" r="11" fill="#38bdf8"/>
            </g>
          </svg>`, 
        desc: '상 확대 관찰 렌즈' 
      }
    ];

    let currentStep = 1;
    let isToastShowing = false;

    const screenStart = document.getElementById('screen-start');
    const screenIntro = document.getElementById('screen-intro');
    const screenGame = document.getElementById('screen-game');
    const btnStart = document.getElementById('btn-start');
    const resetBtn = document.getElementById('reset-btn');
    const introProgress = document.getElementById('intro-progress');
    const partsGrid = document.getElementById('parts-grid');
    const progressText = document.getElementById('progress-text');
    const hintText = document.getElementById('hint-text');
    const errorToast = document.getElementById('error-toast');
    const successMessage = document.getElementById('success-message');

    btnStart.addEventListener('click', () => {
      screenStart.classList.add('hidden');
      screenIntro.classList.remove('hidden');
      screenIntro.classList.add('flex');

      setTimeout(() => {
        introProgress.style.width = '100%';
      }, 50);

      setTimeout(() => {
        screenIntro.classList.add('hidden');
        screenIntro.classList.remove('flex');
        screenGame.classList.remove('hidden');
        screenGame.classList.add('flex');
        resetBtn.classList.remove('hidden');
        initGame();
      }, 2050);
    });

    resetBtn.addEventListener('click', () => {
      initGame();
    });

    function initGame() {
      currentStep = 1;
      successMessage.classList.add('hidden');
      updateProgressUI();

      PARTS_DATA.forEach(part => {
        const visEl = document.getElementById(`vis-${part.id}`);
        if (visEl) visEl.classList.add('hidden');
      });

      const shuffledParts = [...PARTS_DATA].sort(() => Math.random() - 0.5);
      partsGrid.innerHTML = '';

      shuffledParts.forEach(part => {
        const card = document.createElement('button');
        card.id = `btn-part-${part.id}`;
        card.className = 'part-card bg-white border border-amber-200/90 hover:border-amber-400 p-1 rounded-xl flex flex-col items-center justify-between text-center shadow-sm cursor-pointer focus:outline-none w-full active:bg-amber-50 h-full min-h-[60px] overflow-hidden';
        
        card.innerHTML = `
          <div class="part-preview-icon p-0.5 bg-amber-50/80 rounded-lg border border-amber-100/90 w-full flex-1 min-h-0 mb-0.5">
            ${part.svgContent}
          </div>
          <div class="flex flex-col items-center w-full shrink-0">
            <span class="font-extrabold text-amber-950 text-[10px] sm:text-xs leading-none mb-0.5">${part.name}</span>
            <span class="text-[8px] sm:text-[9px] text-amber-700/80 leading-none truncate w-full">${part.desc}</span>
          </div>
        `;

        card.addEventListener('click', () => handlePartClick(part));
        partsGrid.appendChild(card);
      });
    }

    function handlePartClick(part) {
      if (currentStep > PARTS_DATA.length) return;

      if (part.order === currentStep) {
        const visEl = document.getElementById(`vis-${part.id}`);
        if (visEl) {
          visEl.classList.remove('hidden');
        }

        const card = document.getElementById(`btn-part-${part.id}`);
        if (card) {
          card.classList.add('disabled', 'bg-amber-100/50', 'border-amber-300', 'opacity-50', 'cursor-default');
          card.classList.remove('hover:border-amber-400', 'active:bg-amber-50');
          card.disabled = true;
          const badge = document.createElement('span');
          badge.className = 'mt-0.5 text-[8px] bg-amber-600 text-white font-bold px-1 py-0.2 rounded-full leading-none shrink-0';
          badge.textContent = '완료';
          card.appendChild(badge);
        }

        currentStep++;
        updateProgressUI();

        if (currentStep > PARTS_DATA.length) {
          successMessage.classList.remove('hidden');
          hintText.textContent = '🎉 모든 부품 조립 완료!';
          hintText.className = 'text-[10px] sm:text-xs font-bold text-emerald-800 bg-emerald-50 w-full py-0.5 px-1.5 rounded-lg text-center border border-emerald-300';
        }
      } else {
        showErrorToast();
      }
    }

    function showErrorToast() {
      if (isToastShowing) return;
      isToastShowing = true;

      errorToast.classList.remove('opacity-0', 'pointer-events-none');
      errorToast.classList.add('opacity-100', 'shake-anim');

      setTimeout(() => {
        errorToast.classList.remove('opacity-100', 'shake-anim');
        errorToast.classList.add('opacity-0', 'pointer-events-none');
        isToastShowing = false;
      }, 1600);
    }

    function updateProgressUI() {
      const completedCount = currentStep - 1;
      progressText.textContent = `${completedCount} / ${PARTS_DATA.length} 완료`;

      if (currentStep <= PARTS_DATA.length) {
        hintText.textContent = `👉 다음으로 설치할 부품을 선택하세요.`;
      }
    }
  </script>
</body>
</html>
